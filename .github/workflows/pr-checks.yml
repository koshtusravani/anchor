name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor_dev_pw
          POSTGRES_DB: anchor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anchor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter
        run: ruff check .

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg2://anchor:anchor_dev_pw@localhost:5432/anchor
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://anchor:anchor_dev_pw@localhost:5432/anchor
        run: pytest tests/ -v